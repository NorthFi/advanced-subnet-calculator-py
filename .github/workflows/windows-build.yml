# root/.github/workflows/windows-build.yml
name: Windows executable
on:
  pull_request:
    paths:
      - '**/*.py'
      - '.github/workflows/windows-build.yml'
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tool
        run: python -m pip install "pyinstaller>=6,<7"
      - name: Build single-file GUI executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name "advanced-subnet-calculator-py" "advanced-subnet-calculator.py"
      - name: Validate built executable exists and is non-empty
        shell: pwsh
        run: |
          $file = Join-Path 'dist' 'advanced-subnet-calculator-py.exe'
          if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Executable not found: $file" }
          if ((Get-Item -LiteralPath $file).Length -lt 100000) { throw "Executable unexpectedly small: $file" }
      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-windows
          path: dist/*.exe
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-windows
          path: release
      - name: Publish GitHub Release for version tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test -s "release/advanced-subnet-calculator-py.exe"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite."
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" "release/advanced-subnet-calculator-py.exe" --verify-tag --generate-notes --title "${GITHUB_REF_NAME}"
